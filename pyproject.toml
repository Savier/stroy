[project]
name = "stroy"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = [
    "httpx>=0.28.1",
    "xlsxwriter>=3.3.4",
]

[project.scripts]
report-strygotovnost = "report_strygotovnost:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["domrf", "report_strygotovnost"]

[dependency-groups]
dev = [
    "ruff>=0.17.6",
    "ty>=0.0.108",
]
